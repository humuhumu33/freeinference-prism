<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f3ee">
<title>Free verified AI inference.</title>
<meta name="description" content="Ask anything. Every answer is sealed on your device and can be checked again.">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="manifest" href="app.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="mark" href="./" aria-label="freeinference"><img src="mark.svg" alt="" width="22" height="22"></a>
<main>
  <h1>Free verified AI inference.</h1>
  <p class="lede">Ask anything. Every answer is sealed on your device and can be checked again.</p>
  <div class="messages" id="messages"></div>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Ask anything" autocomplete="off" autofocus></textarea>
    <div class="row"><span class="hint mono" id="hint"></span><button class="btn" id="send" type="submit" aria-label="Ask">Ask</button></div>
  </form>
  <p class="state mono" id="state"></p>
</main>
<a class="how" href="https://github.com/humuhumu33/freeinference-prism">How it is built</a>
<script type="module" src="app.js"></script>
</body>
</html>
