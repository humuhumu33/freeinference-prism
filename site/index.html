<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f3ee">
<title>Free verified AI inference.</title>
<meta name="description" content="Ask anything. Every answer is sealed on your device and can be checked again.">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="manifest" href="app.webmanifest">
<link rel="stylesheet" href="app.css">
<script>
// Pre paint appearance, the same canonical state Hologram OS keeps (holo.theme.v1: palette, immersive,
// wallpaper) and the same hooks (data-holo-palette, data-holo-immersive, --holo-wallpaper, color-scheme),
// so the first frame already wears the chosen look. First run: immersive on the curated default.
(function () {
  var root = document.documentElement, s = null;
  try { s = JSON.parse(localStorage.getItem("holo.theme.v1") || "null"); } catch (e) {}
  if (!s || !("immersive" in s)) { s = { palette: "dark", immersive: true, wallpaper: "wallpapers/alps.jpg" }; try { localStorage.setItem("holo.theme.v1", JSON.stringify(s)); } catch (e) {} }
  root.setAttribute("data-holo-palette", s.palette === "light" ? "light" : "dark");
  root.setAttribute("data-holo-immersive", s.immersive ? "on" : "off");
  root.style.setProperty("color-scheme", s.palette === "light" ? "light" : "dark");
  if (s.wallpaper) root.style.setProperty("--holo-wallpaper", "url(" + JSON.stringify(s.wallpaper) + ")");
})();
</script>
</head>
<body>
<a class="mark" href="./" aria-label="Hologram"><img class="on-dark" src="lockup-white.svg" alt="Hologram" width="157" height="30"><img class="on-light" src="lockup-black.svg" alt="Hologram" width="157" height="30"></a>
<button class="appearance" id="appearance" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Appearance"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<div class="popover" id="popover" role="dialog" aria-label="Appearance" hidden>
  <button class="mode" type="button" data-mode="dark">Dark</button>
  <button class="mode" type="button" data-mode="light">Light</button>
  <button class="mode" type="button" data-mode="immersive">Immersive</button>
  <div class="walls" id="walls"><button class="wall" type="button" data-wall="wallpapers/alps.jpg" title="Alpine Dawn" aria-label="Alpine Dawn" style="background-image:url(wallpapers/alps.jpg)"></button><button class="wall" type="button" data-wall="wallpapers/galaxy.jpg" title="Galaxy" aria-label="Galaxy" style="background-image:url(wallpapers/galaxy.jpg)"></button><button class="wall" type="button" data-wall="wallpapers/aurora.jpg" title="Aurora" aria-label="Aurora" style="background-image:url(wallpapers/aurora.jpg)"></button></div>
</div>
<script type="application/json" id="wallpapers">[{"by":"Unsplash","byUrl":"https://unsplash.com/?utm_source=Hologram_AI&utm_medium=referral","file":"wallpapers/alps.jpg","name":"Alpine Dawn"},{"by":"Tiago Ferreira","byUrl":"https://unsplash.com/@tiago_f_ferreira?utm_source=Hologram_AI&utm_medium=referral","file":"wallpapers/galaxy.jpg","name":"Galaxy"},{"by":"Lightscape","byUrl":"https://unsplash.com/@lightscape?utm_source=Hologram_AI&utm_medium=referral","file":"wallpapers/aurora.jpg","name":"Aurora"}]</script>
<main>
  <h1>Free verified AI inference.</h1>
  <p class="lede">Ask anything. Every answer is sealed on your device and can be checked again.</p>
  <div class="messages" id="messages"></div>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Ask anything" autocomplete="off" autofocus></textarea>
    <div class="row"><span class="hint mono" id="hint"></span><button class="btn" id="send" type="submit" aria-label="Ask">Ask</button></div>
  </form>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
