[package]
name = "freeinference-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The freeinference trust core, generated by lean4-prod from the Lean verified model in src/Freeinference.lex.tex. Do not edit generated code."
repository = "https://github.com/humuhumu33/freeinference-prism"

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# The browser boundary and the page projector speak JSON; the model does not.
serde_json = "1"

[[bin]]
name = "project-site"
path = "src/bin/project_site.rs"

[dev-dependencies]

[workspace]
